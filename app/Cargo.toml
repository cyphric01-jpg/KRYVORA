# file: app/Cargo.toml
[package]
name    = "kryvora-app"
version = "0.1.0"
edition = "2021"

# This makes `app/` its own workspace root. It does NOT join the
# parent workspace. The workspace crates are consumed as path
# dependencies below.
[workspace]

[lib]
name       = "kryvora_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
uuid               = { version = "1", features = ["v4", "serde"] }
time               = { version = "0.3", features = ["serde", "formatting", "parsing"] }
rusqlite           = { version = "0.32", features = ["bundled"] }

kryvora-core       = { path = "../crates/kryvora-core" }
kryvora-integrity  = { path = "../crates/kryvora-integrity" }
kryvora-db         = { path = "../crates/kryvora-db" }
kryvora-evidence   = { path = "../crates/kryvora-evidence" }
kryvora-audit      = { path = "../crates/kryvora-audit" }
kryvora-storage    = { path = "../crates/kryvora-storage" }
kryvora-policy     = { path = "../crates/kryvora-policy" }
kryvora-jobs       = { path = "../crates/kryvora-jobs" }
kryvora-sanitize   = { path = "../crates/kryvora-sanitize" }
kryvora-carving    = { path = "../crates/kryvora-carving" }
kryvora-recovery   = { path = "../crates/kryvora-recovery" }
kryvora-provenance = { path = "../crates/kryvora-provenance" }
kryvora-report     = { path = "../crates/kryvora-report" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
